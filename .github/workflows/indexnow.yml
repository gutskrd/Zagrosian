# Tells search engines that use IndexNow (Bing, and through it ChatGPT search,
# Copilot and DuckDuckGo; also Yandex, Seznam and Naver) about every page in the
# live sitemap, so they crawl the site soon after it changes
# (scripts/indexnow.mjs). It runs once the checks have passed on the site's
# branch, by which time Cloudflare has deployed the push, and can be started by
# hand from the Actions tab. Google does not use IndexNow: the sitemap is
# submitted to it in Google Search Console.
name: Search engines

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  indexnow:
    name: IndexNow
    # After a push to the site's branch (the repository's default branch) whose
    # checks passed, or when started by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm run indexnow
