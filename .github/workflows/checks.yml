# Runs on every push: builds the site (including type checks), then tests it as
# it will be served, with production headers: Playwright suites in tests/
# (security, accessibility, layout, SEO, stability, interactions) and Lighthouse.
# Any failure blocks the change before it reaches production.
name: Checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  tests:
    name: Tests
    # Pinned: ubuntu-latest is Ubuntu 26.04, which Playwright 1.56.1 can't install
    # Chromium on. Bump together with Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      # Thresholds and URLs live in lighthouserc.json.
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14
