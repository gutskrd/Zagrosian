# Monthly dependency updates, grouped into a single pull request.
# Security updates are raised separately as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns:
          - '*'
    ignore:
      # `astro check` (run by `npm run build`) does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
