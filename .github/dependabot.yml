# Monthly dependency updates, grouped into a single pull request. Security
# updates are opened separately as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns:
          - '*'
    ignore:
      # `astro check` (part of `npm run build`) doesn't support TypeScript 7 yet.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Actions used by the workflows in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
